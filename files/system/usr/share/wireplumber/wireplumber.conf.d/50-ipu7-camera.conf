# The libcamera node lets applications pick the OV08X40's binned mode, whose
# corrupt IPU7 frames abort WirePlumber. The raw IPU7 capture nodes only carry
# undebayered sensor data. webcam.service publishes the camera instead.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

monitor.v4l2.rules = [
  {
    matches = [
      { device.product.name = "ipu7" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

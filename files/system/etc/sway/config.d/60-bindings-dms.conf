# DankMaterialShell controls. 95-dms.conf starts DMS in this Sway session;
# it owns the bar, notifications, lock screen, and media controls.

# Keep Fedora's normal Mod+d launcher shortcut, but route it to DMS.
unbindsym $mod+d
bindsym $mod+d exec dms ipc call spotlight toggle

# DMS panels and session controls. Avoid Mod+space and Mod+v: Fedora's
# upstream Sway config uses those for focus mode and vertical splitting.
bindsym $mod+comma exec dms ipc call settings focusOrToggle
bindsym $mod+n exec dms ipc call notifications toggle
bindsym $mod+Alt+l exec dms ipc call lock lock

# Audio controls remain available while the screen is locked.
bindsym --locked {
    XF86AudioRaiseVolume exec dms ipc call audio increment 3
    XF86AudioLowerVolume exec dms ipc call audio decrement 3
    XF86AudioMute exec dms ipc call audio mute
    XF86AudioMicMute exec dms ipc call mic mute
}

# MPRIS media controls remain available while the screen is locked.
bindsym --locked {
    XF86AudioPlay exec dms ipc call mpris playPause
    XF86AudioStop exec dms ipc call mpris stop
    XF86AudioForward exec dms ipc call mpris next
    XF86AudioNext exec dms ipc call mpris next
    XF86AudioPause exec dms ipc call mpris playPause
    XF86AudioPrev exec dms ipc call mpris previous
    XF86AudioRewind exec dms ipc call mpris previous
}

# DMS brightness controls (the empty device argument selects the active output).
bindsym --locked {
    XF86MonBrightnessUp exec dms ipc call brightness increment 5 ""
    XF86MonBrightnessDown exec dms ipc call brightness decrement 5 ""
}

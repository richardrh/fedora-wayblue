---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: fedora-sway
description: Wayblue Sway developer workstation with DankMaterialShell

base-image: ghcr.io/wayblueorg/sway
# Wayblue supports only the latest tag.
image-version: latest

stages:
  - name: steel-helix
    from: docker.io/library/rust:1.90-bookworm
    modules:
      - type: script
        scripts:
          - build-steel-helix.sh

modules:
  - from-file: common-packages.yml
  - from-file: dank.yml
  - from-file: kubernetes.yml
  - from-file: flatpaks.yml
  - from-file: fonts.yml

  # Steel-enabled Helix and matching Steel release binaries.
  - type: copy
    from: steel-helix
    src: /out/
    dest: /usr/

  # Dank desktop integration, display scaling, and workstation helpers.
  - type: files
    files:
      - source: system
        destination: /

  # DMS owns notification activation and starts only with the Sway session.
  - type: script
    scripts:
      - configure-dank.sh

  # Pinned tools that aren't sensible Fedora RPMs.
  - type: script
    scripts:
      - install-upstream-tools.sh

  # Refuse to publish an image that regresses this workstation's IPU7 camera.
  - type: script
    scripts:
      - verify-camera-support.sh

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - sshd.service
        - k3s.service
    user:
      enabled:
        - podman.socket
        - workstation-setup.service

  - type: chezmoi
    repository: "https://github.com/richardrh/dotfiles"
    all-users: true
    file-conflict-policy: skip

  - type: signing

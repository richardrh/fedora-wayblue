---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true

      copr:
        - scottames/ghostty
        - jdxcode/mise

      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - adoptium.repo

    install:
      packages:
        # --------------------------------------------------
        # Desktop
        # --------------------------------------------------
        - ghostty
        - emacs-pgtk

        # GUI file manager
        - Thunar
        - thunar-archive-plugin
        - file-roller

        # --------------------------------------------------
        # C / C++
        # --------------------------------------------------
        - gcc
        - gcc-c++
        - clang
        - llvm
        - lld
        - make
        - cmake
        - ninja-build
        - pkgconf-pkg-config

        - tmux
        - vifm

        # --------------------------------------------------
        # Git
        # --------------------------------------------------
        - git
        - gh
        - glab
        - git-delta

        # --------------------------------------------------
        # Data / text
        # --------------------------------------------------
        - jq
        - yq
        - sqlite

        # --------------------------------------------------
        # Shell productivity
        # --------------------------------------------------
        - fzf
        - ripgrep
        - fd-find
        - eza
        - bat
        - zoxide
        - hyperfine
        - tree

        # --------------------------------------------------
        # General Unix tools
        # --------------------------------------------------
        - rsync
        - zip
        - unzip
        - wget
        - curl
        - less
        - file

        # --------------------------------------------------
        # Shell development
        # --------------------------------------------------
        - ShellCheck
        - shfmt

        # --------------------------------------------------
        # System inspection / debugging
        # --------------------------------------------------
        - btop
        - lsof
        - strace
        - bind-utils
        - tcpdump
        - nmap
        - iperf3
        - ethtool
        - smartmontools
        - nvme-cli

        # --------------------------------------------------
        # Project and user tool versions
        # --------------------------------------------------
        - mise

        # --------------------------------------------------
        # Containers
        # --------------------------------------------------
        - podman
        - podman-docker
        - container-selinux
        - distrobox

        # --------------------------------------------------
        # Kubernetes baseline tools
        # --------------------------------------------------
        - helm3
        - kustomize
        - k9s

        # --------------------------------------------------
        # Networking / remote access
        # --------------------------------------------------
        - openssh-server
        - tailscale

        # --------------------------------------------------
        # Backup / secrets
        # --------------------------------------------------
        - restic
        - age

        # --------------------------------------------------
        # SELinux / k3s
        # --------------------------------------------------
        - policycoreutils
        - selinux-policy
        - selinux-policy-base

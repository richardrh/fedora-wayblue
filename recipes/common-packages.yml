---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
        - jdxcode/mise
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - adoptium.repo

    install:
      packages:
        # Desktop applications and integration
        - ghostty
        - emacs-pgtk
        - thunar
        - thunar-archive-plugin
        - file-roller
        - rofi-themes

        # C/C++, Rust, Go, Python, JavaScript, Java, and .NET
        - gcc
        - gcc-c++
        - clang
        - llvm
        - lld
        - make
        - cmake
        - ninja-build
        - pkgconf-pkg-config
        - rust
        - cargo
        - rust-analyzer
        - clippy
        - golang
        - python3
        - python3-devel
        - python-unversioned-command
        - uv
        - nodejs
        - npm
        - temurin-25-jdk
        - dotnet-sdk-10.0

        # Editors, shells, Git, and dotfile support
        - neovim
        - tmux
        - git
        - gh
        - glab
        - jq
        - yq
        - fzf
        - ripgrep
        - fd-find
        - eza
        - bat
        - zoxide
        - git-delta
        - hyperfine
        - tree
        - rsync
        - zip
        - unzip
        - wget
        - curl
        - less
        - file
        - ShellCheck
        - shfmt
        - btop
        - lsof
        - strace
        - vifm
        - stow
        - mise

        # Containers and Fedora-packaged Kubernetes clients
        - podman
        - podman-docker
        - container-selinux
        - distrobox
        - helm3
        - kustomize
        - k9s

        # Networking, remote access, backup, and secrets
        - openssh-server
        - tailscale
        - restic
        - age
        - policycoreutils
        - selinux-policy
        - selinux-policy-base

name: bluebuild

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Noctalia Sway workstation image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select preview image tag
        if: github.ref != 'refs/heads/main'
        run: |
          printf '\nalt-tags: ["noctalia"]\n' >> recipes/recipe.yml
      - name: Build and publish signed image
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipe.yml
          skip_checkout: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          use_cache: false
          verify_install: true
      - name: Exercise the built Sway and Noctalia desktop
        env:
          IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'noctalia' }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/fedora-sway:${IMAGE_TAG}"
          cosign verify --key cosign.pub "$image"
          podman pull "$image"
          mkdir -p artifacts
          chmod 0777 artifacts
          podman run --rm --entrypoint /bin/bash \
            --tmpfs /tmp:mode=1777 \
            -v "$PWD/artifacts:/artifacts" \
            -v "$PWD/.github/scripts/smoke-desktop.sh:/smoke-desktop.sh:ro" \
            "$image" -euc '
              useradd --create-home --uid 1000 smoke
              mkdir -p /run/dbus
              dbus-uuidgen --ensure=/etc/machine-id
              dbus-daemon --system --fork
              exec runuser -u smoke -- bash /smoke-desktop.sh
            '
      - name: Upload desktop screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-desktop-smoke
          path: artifacts/
          if-no-files-found: ignore
